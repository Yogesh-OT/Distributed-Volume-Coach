[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dv-coach-server"
version = "0.1.0"
description = "Planner, learner and API for Distributed Volume Coach"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "sqlalchemy>=2.0.36",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "alembic>=1.14",
  "tzdata>=2024.2",
]

[project.optional-dependencies]
# Production extras: Postgres driver and Firebase token verification.
prod = ["psycopg[binary]>=3.2", "firebase-admin>=6.6"]
dev = ["pytest>=8.3", "httpx>=0.28", "hypothesis>=6.120"]

[tool.setuptools.packages.find]
include = ["app*", "engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
