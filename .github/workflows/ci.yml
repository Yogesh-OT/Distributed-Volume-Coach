name: CI

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest
      # Fails if the models changed without a new migration.
      - run: alembic upgrade head && alembic check
        env:
          DVC_DATABASE_URL: sqlite:///./ci.db

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      # Runs the shared policy test cases against the Kotlin port, then builds the test app.
      - run: gradle testDebugUnitTest assembleDebug
      # Download from the run's Summary page and install on a phone (see README).
      - uses: actions/upload-artifact@v4
        with:
          name: dv-coach-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
